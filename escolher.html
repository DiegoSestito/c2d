<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escolher no Google Drive</title>
<style>
:root{--bg:#f7f6f3;--paper:#fff;--ink:#1f2328;--soft:#5b616b;--line:#e3e1dc;--accent:#5a3fd6;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--paper:#1f2125;--ink:#e8e6e3;--soft:#a3a7ae;--line:#33363c;--accent:#a593ff;--on-accent:#16171a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 16px}
h1{font-size:26px;line-height:1.2;margin:0 0 12px}
p{color:var(--soft)}
button{font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#estado{color:var(--ink);min-height:1.6em}
</style>
</head>
<body>
<main>
<h1>Escolher o manuscrito</h1>
<p>Escolha o Google Docs que o app vai sincronizar com o seu design no Canva. O app só vê os documentos escolhidos aqui.</p>
<button id="escolher" disabled>Escolher no Google Drive</button>
<p id="estado" role="status">Indo para o Google…</p>
</main>
<script>
const CONFIG = {"clientId":"614433344305-oldct2qvu2f6l2o9romh8i16ki8k0qce.apps.googleusercontent.com","apiKey":"AIzaSyBPpQVTit_LXDZUgDrbet9yO2T-hl6o9bM","appId":"614433344305"};
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DOC = 'application/vnd.google-apps.document';
const AUTH = 'https://accounts.google.com/o/oauth2/v2/auth';
const button = document.getElementById('escolher');
const status = document.getElementById('estado');
// this page: Google sends the person back here, with the token after the #
const here = location.origin + location.pathname;
let token = null;
let pickerReady = false;
const say = (text) => { status.textContent = text; };
// something went wrong: the reason and the button, never a new trip to Google by itself
const offer = (text) => { say(text); button.disabled = false; };

// Google's login in this tab (no pop-up, so no click needed); the state ties the answer to this trip
function login() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  const state = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
  sessionStorage.setItem('c2d-state', state);
  const params = new URLSearchParams({ client_id: CONFIG.clientId, redirect_uri: here, response_type: 'token', scope: SCOPE, include_granted_scopes: 'true', state });
  location.replace(AUTH + '?' + params);
}

// what Google sent back in the address: 'nada' (first visit), 'token' or 'recusado'
function arrived() {
  if (!location.hash) return 'nada';
  const back = new URLSearchParams(location.hash.slice(1));
  // the token leaves the address bar (and the history) right away
  history.replaceState(null, '', here);
  const expected = sessionStorage.getItem('c2d-state');
  sessionStorage.removeItem('c2d-state');
  if (back.get('error')) {
    offer('O Google não deu o acesso. Tente de novo.');
    return 'recusado';
  }
  if (!back.get('access_token') || !expected || back.get('state') !== expected) {
    offer('Não consegui confirmar o login do Google. Tente de novo.');
    return 'recusado';
  }
  token = back.get('access_token');
  return 'token';
}

function gapiLoaded() {
  gapi.load('picker', () => {
    pickerReady = true;
    if (token) showPicker();
  });
}
// the project number (setAppId) is what makes Google hand the chosen file to the app; one tab per
// place (setEnableDrives shows only shared drives, so they get a tab of their own)
function showPicker() {
  const docs = () => new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes(DOC);
  const myDrive = docs().setIncludeFolders(true).setParent('root');
  const sharedWithMe = docs().setOwnedByMe(false);
  const sharedDrives = docs().setIncludeFolders(true).setEnableDrives(true);
  new google.picker.PickerBuilder()
    .addView(myDrive)
    .addView(sharedWithMe)
    .addView(sharedDrives)
    .enableFeature(google.picker.Feature.SUPPORT_DRIVES)
    .setOAuthToken(token)
    .setDeveloperKey(CONFIG.apiKey)
    .setAppId(CONFIG.appId)
    .setLocale('pt-BR')
    .setTitle('Escolha o manuscrito (Google Docs)')
    .setCallback(picked)
    .build()
    .setVisible(true);
}
// chosen: the tab closes (the panel picks the document up when Canva shows again); a browser that
// does not let a page close its tab keeps the sentence
function picked(data) {
  if (data.action === google.picker.Action.PICKED) {
    say('Pronto: «' + data.docs[0].name + '». Pode fechar esta aba e voltar ao Canva.');
    window.close();
  } else if (data.action === google.picker.Action.CANCEL) {
    offer('Nenhum documento escolhido.');
  }
}
button.addEventListener('click', () => {
  button.disabled = true;
  say('Indo para o Google…');
  login();
});

const start = arrived();
if (start === 'nada') login();
else if (start === 'token') {
  say('Abrindo a janela do Google…');
  if (pickerReady) showPicker();
}
</script>
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
</body>
</html>
